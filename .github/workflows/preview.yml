# Plan morning-digest § 3 and § 4. Publishes one saved page to GitHub Pages without committing it
# (ADR 0003: no previews in the repo). Run with marker=true for the review, then marker=false to
# upload the same page over the same link with the banner reading "no marker set".
name: preview
on:
  workflow_dispatch:
    inputs:
      marker:
        description: Carry this lane's marker (secret LANE_MARKER) in the banner
        type: boolean
        default: false
      night:
        description: Night to render
        default: '2026-10-28'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false
      - name: Save page
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
        run: npx tsx scripts/save-page.ts "/digest/${{ inputs.night }}" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
